<!DOCTYPE html>
<html>
<head>
    <title>Customer Analytics</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: auto;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        button {
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background: #3498db;
            color: white;
        }

        td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>📊 Customer Behavior Dashboard</h1>
</header>

<div class="container">

    <div class="card">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file">
            <br><br>
            <button type="submit">Analyze Data</button>
        </form>
    </div>

    {% if table %}
    <div class="card">
        <h2>Results</h2>
        {{ table|safe }}
    </div>
    {% endif %}

</div>

</body>
</html>
